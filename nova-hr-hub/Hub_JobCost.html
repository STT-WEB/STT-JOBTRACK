<script>
/* ---------- Job Cost ① ค่าแรงจ่ายจริง (ต้นทุนแรงงานฝั่งบริษัท) ----------
   ตารางเดียวกับ Payroll ① แต่พ่วงคอลัมน์ BP · BQ · BR ของแท็บ PAYROLL_ACTUAL
   = "ต้นทุนแรงงานบริษัท" ซึ่งเป็นตัวเลขที่เอาไปลงจ๊อบจริง
   ต่างกับฝั่งพนักงานตรงที่ ฝั่งพนักงาน = เงินที่ได้รับหลังหัก · ฝั่งบริษัท = เงินที่บริษัทจ่ายออกทั้งก้อน */
function tabCost(){
  const m=st.month, rows=D.companies[st.co].rows.filter(r=>r.m===m&&(st.inclKem||E(r.id).dept!==KEM))
    .filter(r=>st.dept==='all'||E(r.id).dept==+st.dept);
  const V=(r,k,f)=>r[k]!==undefined?r[k]:f;
  const jc={}; D.companies[st.co].jobRows.filter(x=>x.m===m).forEach(x=>jc[x.id]=(jc[x.id]||0)+x.cost);
  const tr=rows.map(r=>{const e=E(r.id), dir=r.dir!==undefined?!!r.dir:e.direct;
    const cbAll=V(r,'cbAll',r.bp), lg=dir?(jc[r.id]||0):null,
          gap=lg==null?null:Math.round((lg-cbAll)*100)/100;
    return {__on:`openEmp('${r.id}')`,
      id:r.id,name:esc(e.name),dept:`${e.dept}·${e.deptName}`,etype:e.type,di:dir?'Direct':'Indirect',
      days:hours(r.days),
      sal:money(V(r,'sal',r.base)), ot:money(V(r,'otTot',r.pot)), ben:money(V(r,'ben',0)),
      cbBase:money(V(r,'cbBase',r.base)), cbOt:money(V(r,'cbOt',r.pot)), cbAll:money(cbAll),
      lg:lg==null?'<span class="muted">ไม่ลงจ๊อบ</span>':money(lg),
      gap:gap==null?'—':money(gap),
      st:gap==null?'<span class="muted">—</span>':(Math.abs(gap)<=0.05?'<span class="chip ok">● ตรง</span>':'<span class="chip bad">● ไม่ตรง</span>'),
      __td:{gap:(gap!=null&&Math.abs(gap)>0.05)?'bad':''}};});
  const sum=k=>rows.reduce((s,r)=>s+(r[k]||0),0);
  const tAll=rows.reduce((s,r)=>s+V(r,'cbAll',r.bp),0);
  const dRows=rows.filter(r=>r.dir!==undefined?r.dir:E(r.id).direct);
  const tDir=dRows.reduce((s,r)=>s+V(r,'cbAll',r.bp),0);
  const tJob=Object.keys(jc).reduce((s,k)=>s+jc[k],0);
  const ok=Math.abs(tDir-tJob)<=1;
  return `
  <div class="filters">
    <div class="fld"><label>งวดเดือน</label><select onchange="setMonth(this.value)">${MONTHS.map(i=>`<option value="${i}" ${st.month===i?'selected':''}>${MTH[i-1]} ${YEAR}</option>`).join('')}</select></div>
    <div class="fld"><label>แผนก</label><select onchange="setDept(this.value)"><option value="all">ทุกแผนก</option>${deptOpts().map(d=>`<option value="${d.code}" ${st.dept==d.code?'selected':''}>${d.code} · ${d.name}</option>`).join('')}</select></div>
    <div style="flex:1"></div><span class="chip info">แหล่ง: PAYROLL_ACTUAL คอลัมน์ BP · BQ · BR</span>
  </div>
  <div class="callout i" style="margin-bottom:14px"><span class="ic">i</span><div>
    หน้านี้คือ <b>ต้นทุนค่าแรงฝั่งบริษัท</b> — ไม่ใช่เงินที่พนักงานได้รับ (อันนั้นอยู่ Payroll ①)<br>
    <span class="muted">ฝั่งพนักงาน = หลังหักประกันสังคม/ภาษี · <b>ฝั่งบริษัท = เงินที่จ่ายออกทั้งก้อน</b> ตัวนี้แหละที่เอาไปลงเป็นต้นทุนจ๊อบ</span></div></div>
  <div class="grid g-5" style="margin-bottom:16px">
    ${kpi('ต้นทุนแรงงานรวม','฿ '+money(tAll),`${rows.length} คน · ${MTH[m-1]} ${YEAR}`)}
    ${kpi('เงินเดือน+สวัสดิการ (BQ)','฿ '+money(rows.reduce((s,r)=>s+V(r,'cbBase',r.base),0)),pct(rows.reduce((s,r)=>s+V(r,'cbBase',r.base),0)/(tAll||1)*100)+' ของต้นทุนแรงงาน')}
    ${kpi('Total OT (BR)','฿ '+money(rows.reduce((s,r)=>s+V(r,'cbOt',r.pot),0)),pct(rows.reduce((s,r)=>s+V(r,'cbOt',r.pot),0)/(tAll||1)*100)+' ของต้นทุนแรงงาน')}
    ${kpi('ต้นทุน Direct (BP)','฿ '+money(tDir),`${dRows.length} คน · ตัวที่ต้องลงจ๊อบ`)}
    ${kpi('ลงจ๊อบไปแล้ว','฿ '+money(tJob),ok?'ตรงกับ Direct':'ต่าง '+money(tJob-tDir)+' บาท',
      ok?'<span class="delta up">✓ ตรง</span>':'<span class="delta down">▲ ไม่ตรง</span>')}
  </div>
  <div class="card">
    <div class="card-h"><h3>ค่าแรงจ่ายจริง (ต้นทุนบริษัท) — ${MTH[m-1]} ${YEAR}</h3><div class="grow"></div>
      <span class="hint">คลิกแถว → ดูรายละเอียดรายคน</span></div>
    ${table([{k:'id',h:'รหัส',sticky:1},{k:'name',h:'ชื่อ-นามสกุล'},{k:'dept',h:'แผนก'},{k:'etype',h:'ประเภท'},{k:'di',h:'D/I'},
      {k:'days',h:'วันทำงาน',r:1},{k:'sal',h:'เงินเดือน',r:1},{k:'ot',h:'Total OT',r:1},{k:'ben',h:'สวัสดิการ',r:1},
      {k:'cbBase',h:'BQ ต้นทุน เงินเดือน+สวัสดิการ',r:1},{k:'cbOt',h:'BR ต้นทุน OT',r:1},
      {k:'cbAll',h:'BP ต้นทุนแรงงานรวม',r:1},
      {k:'lg',h:'ลงจ๊อบแล้ว',r:1},{k:'gap',h:'ต่าง (บาท)',r:1},{k:'st',h:'สถานะ'}],tr,
      {foot:{id:`รวม ${rows.length} คน`,name:'',dept:'',etype:'',di:'',days:hours(sum('days')),
        sal:money(sum('sal')),ot:money(sum('otTot')||sum('pot')),ben:money(sum('ben')),
        cbBase:money(rows.reduce((s,r)=>s+V(r,'cbBase',r.base),0)),
        cbOt:money(rows.reduce((s,r)=>s+V(r,'cbOt',r.pot),0)),
        cbAll:money(tAll),lg:money(tJob),gap:money(tJob-tDir),st:''},maxH:600})}
    <div class="callout ${ok?'i':'d'}" style="margin-top:12px"><span class="ic">${ok?'✓':'✕'}</span><div><b>กฎเหล็ก:</b>
      ต้นทุนแรงงาน Direct (BP) <b class="num">${money(tDir)}</b>
      ${ok?'=':'≠'} ต้นทุนที่ลงจ๊อบทั้งหมด <b class="num">${money(tJob)}</b>
      ${ok?'':`<br><b>ต่าง ${money(tJob-tDir)} บาท</b> — ต้องแก้ก่อนปิดงวด`}</div></div>
  </div>`;
}

/* =========================================================================
   06_jobcost.js  —  กลุ่ม Job Cost — ①Bplus ②JOBTRACK ③Reconcile ④Cal ⑤Allocate ⑥เทียบงบ ⑦Master ⑧Dashboard
   ========================================================================= */
/* ---------- Job Cost ① Time Bplus ---------- */
function tabBplus(){
  const m=st.month, BM=D.meta.bplusMonths||null;
  const R=D.companies[st.co].recon.filter(r=>r.m===m&&(st.inclKem||E(r.id).dept!==KEM));
  /* แปลงไฟล์แล้วหรือยัง — ถ้า Payload ส่งรายชื่อเดือนมาให้ใช้ตัวนั้น (ของจริง) */
  const conv=BM?BM.indexOf(m)>=0:m<NM;
  const rows=R.map(r=>{const e=E(r.id);return {id:r.id,name:esc(e.name),dept:`${e.dept}·${e.deptName}`,
    etype:e.type,h:hours(r.bplus),d:hours(r.bd!==undefined?r.bd:Math.round(r.bplus/8)),
    late:hours(r.lt||0),ab:hours(r.ab||0)};});
  return `
  <div class="filters">
    <div class="fld"><label>ไฟล์รายเดือน</label><select onchange="setMonth(this.value)">${MONTHS.map(i=>`<option value="${i}" ${st.month===i?'selected':''}>${i}.Time Bplus ${MTH[i-1]} ${YEAR}</option>`).join('')}</select></div>
    <div style="flex:1"></div><button class="btn">เปิดโฟลเดอร์ต้นทาง</button><button class="btn primary">แปลงเป็น Google Sheets แล้วนำเข้า</button>
  </div>
  ${conv?`<div class="callout i" style="margin-bottom:14px"><span class="ic">✓</span><div>ไฟล์ <b>${m}.Time Bplus ${MTH[m-1]} ${YEAR}</b> แปลงแล้ว · นำเข้า <b>${rows.length}</b> บรรทัด</div></div>`
   :`<div class="callout q" style="margin-bottom:14px"><span class="ic">!</span><div><b>ยังอ่านไม่ได้</b> — ไฟล์เดือนนี้เป็น <b>.xlsx</b> ต้องแปลงเป็น Google Sheets ก่อน<br><span class="muted">เปิดไฟล์ใน Drive → ไฟล์ → บันทึกเป็น Google ชีต → กดปุ่ม "แปลงเป็น Google Sheets แล้วนำเข้า"</span></div></div>`}
  <div class="card"><div class="card-h"><h3>ชั่วโมงจากการสแกนนิ้ว (Bplus) — ${MTH[m-1]} ${YEAR}</h3><div class="grow"></div>
    <span class="chip ${conv?'ok':'warn'}">${conv?'นำเข้าแล้ว':'รอแปลงไฟล์'}</span></div>
    ${conv?table([{k:'id',h:'รหัส',sticky:1},{k:'name',h:'ชื่อ'},{k:'dept',h:'แผนก'},{k:'etype',h:'ประเภท'},
      {k:'h',h:'ชม.รวมจาก Bplus',r:1},{k:'d',h:'≈ วันทำงาน',r:1},{k:'late',h:'สาย (ครั้ง)',r:1},{k:'ab',h:'ขาด (วัน)',r:1}],rows,{maxH:600})
     :`<div class="skel-row" style="flex-direction:column;align-items:stretch;gap:10px;padding:26px">
        ${[80,60,70,50].map(w=>`<div class="skel-bar" style="width:${w}%"></div>`).join('')}
        <div class="muted small" style="text-align:center;margin-top:8px">ไม่มีข้อมูล — ต้องแปลงไฟล์ก่อน</div></div>`}</div>`;
}

/* ---------- Job Cost ② Time JOBTRACK ---------- */
function tabJT(){
  const m=st.month;
  let JR=D.companies[st.co].jobRows.filter(x=>x.m===m&&(st.inclKem||E(x.id).dept!==KEM));
  if(st.dept!=='all')JR=JR.filter(x=>E(x.id).dept==+st.dept);
  if(st.job!=='all')JR=JR.filter(x=>x.job===st.job);
  const byEmp={}; JR.forEach(x=>{const b=byEmp[x.id]||(byEmp[x.id]={jobs:new Set(),procs:new Set(),th:0,cost:0});
    b.jobs.add(x.job);b.procs.add(x.proc);b.th+=x.th;b.cost+=x.cost;});
  const empRows=Object.entries(byEmp).sort((a,b)=>b[1].th-a[1].th).map(([id,b])=>{const e=E(id);
    return {__on:`drillEmpJT('${id}')`,id,name:esc(e.name),dept:`${e.dept}·${e.deptName}`,
      njob:hours(b.jobs.size),nproc:hours(b.procs.size),th:hours(b.th),cost:money(b.cost),
      cph:money(b.th?b.cost/b.th:0)};});
  const rows=JR.slice().sort((a,b)=>b.th-a.th).map(x=>{const e=E(x.id),j=JOB[x.job]||{};
    return {id:x.id,name:esc(e.name),dept:`${e.dept}·${e.deptName}`,job:x.job,jname:esc(j.name||''),
      cust:esc(j.cust||''),proc:`${x.proc} · ${procName(x.proc)}`,
      hn:hours(x.hn),o15:hours(x.ot15),o30:hours(x.ot30),hhol:hours(x.hhol),th:hours(x.th),cost:money(x.cost)};});
  const T=k=>JR.reduce((s,x)=>s+x[k],0);
  const jobsIn=[...new Set(D.companies[st.co].jobRows.map(x=>x.job))].sort();
  const miss=E(JR[0]?.id||'');
  return `
  <div class="filters">
    <div class="fld"><label>เดือน</label><select onchange="setMonth(this.value)">${MONTHS.map(i=>`<option value="${i}" ${st.month===i?'selected':''}>${MTH[i-1]} ${YEAR}</option>`).join('')}</select></div>
    <div class="fld"><label>แผนก</label><select onchange="setDept(this.value)"><option value="all">ทุกแผนก</option>
      ${deptOpts().filter(d=>d.direct).map(d=>`<option value="${d.code}" ${st.dept==d.code?'selected':''}>${d.code} · ${d.name}</option>`).join('')}</select></div>
    <div class="fld"><label>จ๊อบ</label><select onchange="st.job=this.value;render()"><option value="all">ทุกจ๊อบ</option>
      ${jobsIn.map(j=>`<option ${st.job===j?'selected':''}>${j}</option>`).join('')}</select></div>
  </div>
  <div class="callout q" style="margin-bottom:14px"><span class="ic">⚠</span><div>
    <b>งานค้าง — ลืม Check Out:</b> ระบบใหม่จะตั้งธงแดงให้ HR + เตือนพนักงานทาง LINE อัตโนมัติ
    และ<b>ล็อกไม่ให้เอาชั่วโมงนั้นเข้าต้นทุน</b>จนกว่าหัวหน้าจะยืนยัน${miss.name?` (ตัวอย่าง: ${esc(miss.name)} วันที่ 05/${String(m).padStart(2,'0')})`:''}</div></div>
  <div class="grid g-4" style="margin-bottom:16px">
    ${kpi('พนักงานที่ลงจ๊อบ',hours(Object.keys(byEmp).length)+' <small>คน</small>',MTH[m-1]+' '+YEAR)}
    ${kpi('ชั่วโมงรวมลงจ๊อบ',hours(T('th'))+' <small>ชม.</small>',`ปกติ ${hours(T('hn'))} · OT ${hours(T('ot15')+T('ot30'))} · วันหยุด ${hours(T('hhol'))}`)}
    ${kpi('ต้นทุนค่าแรงลงจ๊อบ','฿ '+money(T('cost')),'เท่ากับ BP ของพนักงาน Direct')}
    ${kpi('จ๊อบที่มีการลงเวลา',hours(new Set(JR.map(x=>x.job)).size)+' <small>จ๊อบ</small>','เดือนนี้')}
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>พนักงาน 1 คน ทำไปกี่จ๊อบ — ${MTH[m-1]} ${YEAR}</h3><div class="grow"></div>
      <span class="hint">คลิกแถวเพื่อดูว่าลงจ๊อบไหน process อะไรบ้าง</span></div>
    ${table([{k:'id',h:'รหัส',sticky:1},{k:'name',h:'ชื่อ'},{k:'dept',h:'แผนก'},{k:'njob',h:'จำนวนจ๊อบ',r:1},
      {k:'nproc',h:'จำนวน Process',r:1},{k:'th',h:'ชม.รวม',r:1},{k:'cost',h:'ต้นทุนค่าแรง',r:1},{k:'cph',h:'ต้นทุน/ชม.',r:1}],empRows,
      {foot:{id:`รวม ${empRows.length} คน`,name:'',dept:'',njob:'',nproc:'',th:hours(T('th')),cost:money(T('cost')),cph:''},maxH:420})}</div>
  ${st.drill?drillPanel():''}
  <div class="card"><div class="card-h"><h3>รายการลงเวลาต่อจ๊อบ · ต่อ Process</h3><div class="grow"></div>
    <span class="hint">หัวตารางตรึง · คอลัมน์แรกตรึง · กรองได้ทุกคอลัมน์</span></div>
    ${table([{k:'id',h:'รหัส',sticky:1},{k:'name',h:'ชื่อ'},{k:'dept',h:'แผนก'},{k:'job',h:'JOB CODE'},
      {k:'jname',h:'ชื่องาน'},{k:'cust',h:'ลูกค้า'},{k:'proc',h:'Process'},
      {k:'hn',h:'ชม.ปกติ',r:1},{k:'o15',h:'ชม.OT1.5',r:1},{k:'o30',h:'ชม.OT3',r:1},{k:'hhol',h:'ชม.วันหยุด',r:1},
      {k:'th',h:'ชม.รวม',r:1},{k:'cost',h:'ต้นทุน (บาท)',r:1}],rows,
      {foot:{id:`รวม ${rows.length} บรรทัด`,name:'',dept:'',job:'',jname:'',cust:'',proc:'',
        hn:hours(T('hn')),o15:hours(T('ot15')),o30:hours(T('ot30')),hhol:hours(T('hhol')),
        th:hours(T('th')),cost:money(T('cost'))},maxH:600})}</div>`;
}
function drillEmpJT(id){st.drill=id;render();}
function drillPanel(){
  const id=st.drill,e=E(id),m=st.month;
  const X=D.companies[st.co].jobRows.filter(x=>x.m===m&&x.id===id);
  if(!X.length)return '';
  const rows=X.map(x=>{const j=JOB[x.job]||{};return {job:x.job,jname:esc(j.name||''),proc:`${x.proc} · ${procName(x.proc)}`,
    hn:hours(x.hn),ot:hours(x.ot15+x.ot30),hhol:hours(x.hhol),th:hours(x.th),cost:money(x.cost),
    sh:pct(x.th/X.reduce((s,y)=>s+y.th,0)*100)};});
  const T=k=>X.reduce((s,x)=>s+x[k],0);
  return `<div class="card drill" style="margin-bottom:16px">
    <div class="card-h"><h3>เจาะดู: ${esc(e.name)} (${id}) — ${MTH[m-1]}</h3><div class="grow"></div>
      <button class="btn xs" onclick="st.drill=null;render()">ปิด</button></div>
    ${table([{k:'job',h:'JOB CODE',sticky:1},{k:'jname',h:'ชื่องาน'},{k:'proc',h:'Process'},
      {k:'hn',h:'ชม.ปกติ',r:1},{k:'ot',h:'ชม.OT',r:1},{k:'hhol',h:'ชม.วันหยุด',r:1},{k:'th',h:'ชม.รวม',r:1},
      {k:'sh',h:'สัดส่วนเวลา',r:1},{k:'cost',h:'ต้นทุน',r:1}],rows,
      {foot:{job:'รวม',jname:'',proc:'',hn:hours(T('hn')),ot:hours(T('ot15')+T('ot30')),hhol:hours(T('hhol')),
        th:hours(T('th')),sh:'100.00%',cost:money(T('cost'))},filter:false})}</div>`;
}

/* ---------- Job Cost ③ Reconcile (2 ตัว + หาต้นตอ) ---------- */
function tabRec(){
  const m=st.month, ready=m<=NM;
  /* เดือนที่ยกเวลามาจากระบบเก่า → ด่าน ① เช็คเวลา เป็นข้อมูลอ้างอิง ไม่บล็อกปิดงวด
     ด่าน ② เช็คยอดเงิน ยังเข้มเหมือนเดิมทุกเดือน */
  const legacy = m <= (D.meta.legacyTimeUntil||0);
  const R=D.companies[st.co].recon.filter(r=>r.m===m&&(st.inclKem||E(r.id).dept!==KEM));
  const rowsOf=D.companies[st.co].rows.filter(r=>r.m===m);
  const DIR=r=>r.dir!==undefined?!!r.dir:!!E(r.id).direct;   /* Direct/Indirect ของเดือนนั้น */
  const bpOf={}; rowsOf.forEach(r=>bpOf[r.id]=r.bp);
  const jc={}; D.companies[st.co].jobRows.filter(x=>x.m===m).forEach(x=>jc[x.id]=(jc[x.id]||0)+x.cost);
  const A=R.map(r=>{const e=E(r.id);
    r.cause = r.c>=0 ? D.causes[r.c].t : '';
    const cost=DIR(r)?Math.round((jc[r.id]||0)*100)/100:null;
    const bp=bpOf[r.id], mdiff=cost==null?null:Math.round((cost-bp)*100)/100;
    return {...r,e,cost,bp,mdiff};});
  const tdiff=A.filter(x=>x.diff!==0), mdiff=A.filter(x=>x.mdiff!==null&&Math.abs(x.mdiff)>0.02);
  const rows=A.map(x=>({__on:x.diff!==0?`rootCause('${x.id}')`:'',
    id:x.id,name:esc(x.e.name),dept:`${x.e.dept}·${x.e.deptName}`,di:x.e.direct?'Direct':'Indirect',
    bplus:hours(x.bplus),jt:hours(x.jt),d:(x.diff>0?'+':'')+hours(x.diff),
    st1:x.diff===0?'<span class="chip ok">● ตรง</span>'
        :(legacy?'<span class="chip warn">● ต่าง (ระบบเก่า)</span>':'<span class="chip bad">● ไม่ตรง</span>'),
    cause:x.cause?`<span class="chip warn">${x.cause}</span>`:'<span class="muted">—</span>',
    cost:x.cost==null?'<span class="muted">ไม่ลงจ๊อบ</span>':money(x.cost),bp:money(x.bp),
    md:x.mdiff==null?'—':money(x.mdiff),

function rootCause(id){st.drill='rc:'+id;render();window.scrollTo(0,0);}
function rootPanel(){
  if(!String(st.drill).startsWith('rc:'))return '';
  const id=st.drill.slice(3),m=st.month,e=E(id);
  const r=D.companies[st.co].recon.find(x=>x.m===m&&x.id===id); if(!r)return '';
  const row=D.companies[st.co].rows.find(x=>x.m===m&&x.id===id);
  /* กระจายชั่วโมงลงรายวันแบบคงที่ เพื่อโชว์ว่าวันไหนต่าง */
  const nd=Math.max(1,row.days||Math.round(row.th/8)||1), per=Math.floor((row.hn||0)/nd);
  const days=Array.from({length:nd},(_,i)=>({d:i+1,jt:per,bp:per}));
  let rem=r.diff, i=0;
  while(rem!==0&&i<nd){const s=rem>0?1:-1;days[i].bp+=s;rem-=s;i++;}
  const diffDays=days.filter(d=>d.jt!==d.bp);
  const cs = r.c>=0 ? D.causes[r.c] : {t:'ยังระบุไม่ได้',d:'ไม่เข้าอาการที่ระบบรู้จัก — ต้องเปิดใบลงเวลาจริงดู'};
  const rows=days.map(d=>({d:`${String(d.d).padStart(2,'0')}/${String(m).padStart(2,'0')}/69`,
    bp:hours(d.bp),jt:hours(d.jt),diff:d.bp===d.jt?'0':(d.bp-d.jt>0?'+':'')+hours(d.bp-d.jt),
    s:d.bp===d.jt?'<span class="chip ok">ตรง</span>':'<span class="chip bad">ไม่ตรง</span>',
    __td:d.bp===d.jt?{}:{diff:'bad'}}));
  return `<div class="card drill" style="margin-bottom:16px">
    <div class="card-h"><h3>🔎 หาต้นตอ: ${esc(e.name)} (${id}) — ${MTH[m-1]} ${YEAR}</h3><div class="grow"></div>
      <button class="btn xs" onclick="st.drill=null;render()">ปิด</button></div>
    <div class="grid g-3" style="margin-bottom:14px">
      ${kpi('ชั่วโมง Bplus',hours(r.bplus)+' <small>ชม.</small>','จากการสแกนนิ้ว')}
      ${kpi('ชั่วโมง JOBTRACK',hours(r.jt)+' <small>ชม.</small>','จากการลงจ๊อบ')}
      ${kpi('ต่างกัน',(r.diff>0?'+':'')+hours(r.diff)+' <small>ชม.</small>',`พบ ${diffDays.length} วันที่ไม่ตรง`)}
    </div>
    <div class="callout q" style="margin-bottom:14px"><span class="ic">💡</span><div>
      <b>สาเหตุที่ระบบเดา: ${cs.t}</b><br><span class="muted">${cs.d}</span></div></div>
    <div class="card" style="background:var(--surface-2);margin-bottom:14px">
      <div class="card-h"><h3 style="font-size:14px">ตรวจรายวัน — Bplus เทียบ JOBTRACK</h3></div>
      ${table([{k:'d',h:'วันที่',sticky:1},{k:'bp',h:'ชม. Bplus',r:1},{k:'jt',h:'ชม. JOBTRACK',r:1},
        {k:'diff',h:'ต่าง',r:1},{k:'s',h:'สถานะ'}],rows,{maxH:300,filter:false})}
    </div>
    <div class="filters" style="margin-bottom:0">
      <div class="fld" style="flex:1;min-width:260px"><label>บันทึกว่าแก้อะไร (เก็บประวัติ ใครแก้ เมื่อไหร่)</label>
        <input placeholder="เช่น แก้เวลาออกงานวันที่ 12 ให้ตรงกับใบลงเวลา"></div>
      <div class="fld"><label>ผลการตรวจ</label><select><option>ยืนยันแก้แล้ว — ใช้ตัวเลข Bplus</option>
        <option>ยืนยันแก้แล้ว — ใช้ตัวเลข JOBTRACK</option><option>รอหัวหน้าแผนกยืนยัน</option></select></div>

  after(()=>chartHBar(document.getElementById('ch-bud'),{fmt:v=>pct(v),unit:'%',
    items:J.slice().sort((a,b)=>b.pctBudget-a.pctBudget).slice(0,14).map(j=>({label:j.code,value:j.pctBudget,
      color:j.pctBudget>100?CSS('--critical'):j.pctBudget>90?CSS('--warning'):CSS('--good'),
      note:`ต้นทุน ${money(j.total)} จากงบ ${money(j.estBudget)}`}))}));
  return `
  <div class="filters">
    <div class="fld"><label>จ๊อบ</label><select onchange="st.job=this.value;render()"><option value="all">ทุกจ๊อบ</option>
      ${D.jobs.map(j=>`<option ${st.job===j.code?'selected':''}>${j.code}</option>`).join('')}</select></div>
    <div style="flex:1"></div><span class="chip info">ต้นทุน = ค่าแรงเท่านั้น ยังไม่รวมวัตถุดิบ</span>
  </div>
  <div class="callout i" style="margin-bottom:14px"><span class="ic">i</span><div>
    <b>Est. Budget</b> = งบค่าแรงตั้งต้น · <b>Sale Budget</b> = ยอดขาย (มาจากไฟล์ Payroll DB: Budget labour และ billaftrDiscAmnt)
    · เกณฑ์เดิมของบริษัท: <b>คุมค่าแรงไม่เกิน 90% ของงบ</b></div></div>
  <div class="grid g-5" style="margin-bottom:16px">
    ${kpi('Sale Budget รวม','฿ '+money(T('saleBudget')),`${J.length} จ๊อบ`)}
    ${kpi('Est. Budget รวม','฿ '+money(T('estBudget')),'งบค่าแรงตั้งต้น')}
    ${kpi('ต้นทุนค่าแรงจริงรวม','฿ '+money(T('total')),`Direct ${money(T('sttLabor'))} + Indirect ${money(T('indirect'))} + ผรม. ${money(T('sub'))} + ยกมา ${money(T('carry'))}`)}
    ${kpi('ส่วนต่างจากงบ','฿ '+money(T('varBudget')),pct(T('total')/T('estBudget')*100)+' ของงบ',
      T('varBudget')<0?'<span class="delta down">▲ เกินงบ</span>':'<span class="delta up">▼ อยู่ในงบ</span>')}
    ${kpi('จ๊อบที่เกินงบ',hours(J.filter(j=>j.pctBudget>100).length)+' <small>จาก '+J.length+'</small>',
      'เกิน 90% อีก '+J.filter(j=>j.pctBudget>90&&j.pctBudget<=100).length+' จ๊อบ')}
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>เทียบต้นทุนค่าแรงกับงบ รายจ๊อบ</h3><div class="grow"></div>
    <span class="hint">คลิกแถว → ไปหน้า Master ของจ๊อบนั้น</span></div>
    ${table([{k:'code',h:'JOB CODE',sticky:1},{k:'name',h:'ชื่องาน'},{k:'cust',h:'ลูกค้า'},{k:'type',h:'ประเภท'},
      {k:'carry',h:'ยอดยกมา',r:1},{k:'labor',h:'ค่าแรง STT',r:1},{k:'ind',h:'Indirect ที่ปัน',r:1},
      {k:'sub',h:'ค่าแรงผู้รับเหมา',r:1},{k:'tot',h:'ต้นทุนรวม',r:1},{k:'est',h:'Est. Budget',r:1},
      {k:'vr',h:'ส่วนต่าง',r:1},{k:'pc',h:'% Cost/Budget',r:1},{k:'sale',h:'Sale Budget',r:1},
      {k:'s',h:'สถานะ'},{k:'flag',h:'ธงเตือน'}],rows,
      {foot:{code:'รวม',name:'',cust:'',type:'',carry:money(T('carry')),labor:money(T('sttLabor')),
        ind:money(T('indirect')),sub:money(T('sub')),tot:money(T('total')),est:money(T('estBudget')),
        vr:money(T('varBudget')),pc:pct(T('total')/T('estBudget')*100),sale:money(T('saleBudget')),s:'',flag:''},maxH:560})}</div>
  <div class="card"><div class="card-h"><h3>% ต้นทุนต่องบ — 14 จ๊อบที่สูงสุด</h3><div class="grow"></div>
    <span class="legend" style="margin:0"><span><i class="swatch" style="background:var(--good)"></i>≤90%</span>
    <span><i class="swatch" style="background:var(--warning)"></i>90–100%</span>
    <span><i class="swatch" style="background:var(--critical)"></i>เกิน 100%</span></span></div>
    <div class="chart" id="ch-bud"></div></div>`;
}

/* ---------- Job Cost ⑦ Master จ๊อบ ---------- */
function tabMaster(){
  let J=D.jobs.slice();
  if(st.job!=='all')J=J.filter(j=>j.code===st.job);
  const rows=J.map(j=>{
    const o={__on:`st.job='${j.code}';st.tab='dash';render()`,code:j.code,name:esc(j.name),type:j.type,
      start:dth(j.start),due:dth(j.due),lead:hours(j.leadDays),prog:j.done?'<span class="chip ok">ส่งมอบแล้ว</span>':'<span class="chip info">อยู่ระหว่างผลิต</span>',
      carry:money(j.carry)};
    MONTHS.forEach(m=>o['m'+m]=money(j.byMonth[String(m)]||0));
    o.labor=money(j.sttLabor); o.ind=money(j.indirect); o.sub=money(j.sub); o.tot=money(j.total);
    return o;});
  const cols=[{k:'code',h:'JOB CODE',sticky:1},{k:'name',h:'ชื่องาน'},{k:'type',h:'ประเภท'},
    {k:'start',h:'วันเริ่มงาน'},{k:'due',h:'วันส่งมอบ'},{k:'lead',h:'ใช้เวลา (วัน)',r:1},{k:'prog',h:'สถานะ'},
    {k:'carry',h:'ยอดยกมา',r:1},
    ...MONTHS.map(m=>({k:'m'+m,h:MTH[m-1],r:1})),
    {k:'labor',h:'รวมค่าแรง STT',r:1},{k:'ind',h:'Indirect',r:1},{k:'sub',h:'ผู้รับเหมา',r:1},{k:'tot',h:'Total Cost',r:1}];
  const foot={code:'รวม',name:'',type:'',start:'',due:'',lead:'',prog:'',
    carry:money(J.reduce((s,j)=>s+j.carry,0))};
  MONTHS.forEach(m=>foot['m'+m]=money(J.reduce((s,j)=>s+(j.byMonth[String(m)]||0),0)));
  foot.labor=money(J.reduce((s,j)=>s+j.sttLabor,0)); foot.ind=money(J.reduce((s,j)=>s+j.indirect,0));
  foot.sub=money(J.reduce((s,j)=>s+j.sub,0)); foot.tot=money(J.reduce((s,j)=>s+j.total,0));
  /* ค่าแรงรายเดือน: จ๊อบ vs Payroll */
  const mRows=MONTHS.map(m=>{const jm=D.jobs.reduce((s,j)=>s+(j.byMonth[String(m)]||0),0);
    const bp=D.companies.STT.rows.filter(r=>r.m===m&&E(r.id).direct).reduce((s,r)=>s+r.bp,0);
    const al=D.companies.STT.alloc[String(m)];
    return {m:MTH[m-1],job:money(jm),bp:money(bp),d:money(jm-bp),
      s:Math.abs(jm-bp)<0.05?'<span class="chip ok">● ตรง</span>':'<span class="chip bad">● ไม่ตรง</span>',
      ind:money(al.pool),rate:money(al.rate),tot:money(jm+al.pool),
      __td:Math.abs(jm-bp)<0.05?{}:{d:'bad'}};});
  const leadAvg=J.length?J.reduce((s,j)=>s+j.leadDays,0)/J.length:0;
  return `
  <div class="filters">
    <div class="fld"><label>จ๊อบ</label><select onchange="st.job=this.value;render()"><option value="all">ทุกจ๊อบ</option>
      ${D.jobs.map(j=>`<option ${st.job===j.code?'selected':''}>${j.code}</option>`).join('')}</select></div>
    <div style="flex:1"></div><span class="chip info">เลื่อนตารางไปทางขวาเพื่อดูครบ 12 เดือน</span>
  </div>
  <div class="grid g-4" style="margin-bottom:16px">
    ${kpi('จ๊อบทั้งหมด',hours(J.length)+' <small>จ๊อบ</small>','ส่งมอบแล้ว '+J.filter(j=>j.done).length+' จ๊อบ')}
    ${kpi('ระยะเวลาปิดจบเฉลี่ย',hours(Math.round(leadAvg))+' <small>วัน</small>',
      `เร็วสุด ${Math.min(...J.map(j=>j.leadDays))} · ช้าสุด ${Math.max(...J.map(j=>j.leadDays))} วัน`)}
    ${kpi('ต้นทุนค่าแรงรวม','฿ '+money(J.reduce((s,j)=>s+j.total,0)),'รวมยอดยกมา + Indirect + ผู้รับเหมา')}
    ${kpi('ยอดยกมาจากปีก่อน','฿ '+money(J.reduce((s,j)=>s+j.carry,0)),J.filter(j=>j.carry>0).length+' จ๊อบข้ามปี')}
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Master รายจ๊อบ — ค่าแรงรายเดือน + ยอดยกมา</h3><div class="grow"></div>
    <span class="hint">คลิกแถว → Dashboard จ๊อบ</span></div>
    ${table(cols,rows,{foot,maxH:560})}</div>
  <div class="card"><div class="card-h"><h3>ด่านตรวจรายเดือน — ค่าแรงที่ลงจ๊อบ เทียบ เงินที่ Payroll จ่ายจริง</h3><div class="grow"></div>
    <span class="chip warn">Direct Cost ต้องเท่ากับ Payroll เสมอ</span></div>
    ${table([{k:'m',h:'เดือน',sticky:1},{k:'job',h:'ค่าแรง Direct ที่ลงจ๊อบ',r:1},{k:'bp',h:'BP ที่ Payroll จ่ายจริง',r:1},
      {k:'d',h:'ผลต่าง',r:1},{k:'s',h:'สถานะ'},{k:'ind',h:'Indirect ที่ปันเข้าจ๊อบ',r:1},
      {k:'rate',h:'อัตราจัดสรร/ชม.',r:1},{k:'tot',h:'ต้นทุนค่าแรงรวมของเดือน',r:1}],mRows,{filter:false})}
    <div class="callout i" style="margin-top:12px"><span class="ic">✓</span><div>
      ทุกเดือน: <b>ค่าแรง Direct ที่ลงจ๊อบ = BP ที่ Payroll จ่ายจริง</b> — นี่คือกฎเหล็กที่ระบบบังคับให้ผ่านก่อนปิดงวด</div></div></div>`;
}

/* ---------- Job Cost ⑧ Dashboard จ๊อบ ---------- */
function tabDash(){
  let J=D.jobs.slice();
  if(st.job!=='all')J=J.filter(j=>j.code===st.job);
  const on=J.filter(j=>j.done&&j.dueM<=NM).length, late=J.filter(j=>!j.done&&j.dueM<=NM).length,
        open=J.filter(j=>!j.done&&j.dueM>NM).length;
  const series=D.processes.map((p,i)=>({name:p.code+' · '+p.name,color:S[i],
    values:MONTHS.map(m=>Math.round(D.companies.STT.jobRows.filter(x=>x.m===m&&x.proc===p.code&&J.some(j=>j.code===x.job)).reduce((s,x)=>s+x.cost,0)*100)/100)}));
  after(()=>chartStacked(document.getElementById('ch-proc'),{labels:MONTHS.map(m=>MTH[m-1]),series,
    footerFn:i=>`ค่าแรง Direct ที่ลงจ๊อบเดือน ${MTH[i]}`}));
  const tl=J.map(j=>{
    const s=(j.startM-1)/12*100, e=Math.min(12,j.dueM)/12*100;
    const cls=j.done?'ontime':(j.dueM<=NM?'late':'open');
    return `<div class="tl-row"><div class="tl-name" title="${esc(j.name)}">${j.code} · ${esc(j.name)}</div>
      <div class="tl-track" onmousemove="tlTip(event,'${j.code}')" onmouseleave="hideTip()">
        <div class="tl-bar ${cls}" style="left:${s}%;width:${Math.max(1.5,e-s)}%"></div>
        <div class="tl-marker" style="left:${Math.min(12,j.dueM)/12*100}%"></div></div></div>`;}).join('');
  const pr=D.procRows.filter(p=>J.some(j=>j.code===p.job)).sort((a,b)=>b.cost-a.cost);
  const totC=pr.reduce((s,p)=>s+p.cost,0);
  const prRows=pr.map(p=>{const j=JOB[p.job]||{};return {job:p.job,jname:esc(j.name||''),
    proc:`${p.proc} · ${procName(p.proc)}`,heads:hours(p.heads),hn:hours(p.hn),ot:hours(p.ot),
    th:hours(p.th),cost:money(p.cost),sh:pct(p.cost/totC*100),cph:money(p.cph)};});
  return `
  <div class="filters">
    <div class="fld"><label>จ๊อบ</label><select onchange="st.job=this.value;render()"><option value="all">ทุกจ๊อบ</option>
      ${D.jobs.map(j=>`<option ${st.job===j.code?'selected':''}>${j.code}</option>`).join('')}</select></div>
    <div class="fld"><label>ช่วงวันที่ (เริ่มงาน)</label><input type="date" value="2026-01-01"></div>
    <div class="fld"><label>ถึง</label><input type="date" value="2026-12-31"></div>
    <div style="flex:1"></div><button class="btn">หน้า Verify รายเดือน</button>
  </div>
  <div class="grid g-4" style="margin-bottom:16px">
    ${kpi('จ๊อบทั้งหมด',hours(J.length)+' <small>จ๊อบ</small>','ตามตัวกรอง')}
    ${kpi('ส่งมอบแล้ว',hours(on)+' <small>จ๊อบ</small>',pct(on/(J.length||1)*100))}
    ${kpi('เลยกำหนดส่ง',hours(late)+' <small>จ๊อบ</small>','ต้องรีวิวสาเหตุ')}
    ${kpi('อยู่ในช่วงผลิต',hours(open)+' <small>จ๊อบ</small>','ยังไม่ถึงกำหนด')}
  </div>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>ไทม์ไลน์จ๊อบ — เริ่มงาน → ส่งมอบ</h3><div class="grow"></div>
    <span class="legend" style="margin:0"><span><i class="swatch" style="background:var(--good)"></i>ส่งมอบแล้ว</span>
    <span><i class="swatch" style="background:var(--critical)"></i>เลยกำหนด</span>
    <span><i class="swatch" style="background:var(--s-1)"></i>อยู่ในช่วง</span>
    <span><i class="swatch" style="background:var(--warning);width:3px"></i>เส้นวันส่งมอบ</span></span></div>
    <div class="tl-head"><div></div><div class="tl-scale">${MTH.map(m=>`<span>${m}</span>`).join('')}</div></div>
    ${tl}</div>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>สัดส่วนค่าแรงตาม Process รายเดือน</h3></div>
    <div class="chart" id="ch-proc"></div>
    <div class="legend">${series.map(s=>`<span><i class="swatch" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div></div>
  <div class="card"><div class="card-h"><h3>เจาะดูราย Process — ใช้กี่คน กี่ชั่วโมง ต้นทุนเท่าไหร่ กี่ %</h3></div>
    ${table([{k:'job',h:'JOB CODE',sticky:1},{k:'jname',h:'ชื่องาน'},{k:'proc',h:'Process'},
      {k:'heads',h:'จำนวนคน',r:1},{k:'hn',h:'ชม.ปกติ',r:1},{k:'ot',h:'ชม.OT',r:1},{k:'th',h:'ชม.รวม',r:1},
      {k:'cost',h:'ต้นทุน (บาท)',r:1},{k:'sh',h:'% ของทั้งหมด',r:1},{k:'cph',h:'ต้นทุน/ชม.',r:1}],prRows,
      {foot:{job:'รวม',jname:'',proc:'',heads:'',hn:'',ot:'',th:hours(pr.reduce((s,p)=>s+p.th,0)),
        cost:money(totC),sh:'100.00%',cph:''},maxH:520})}</div>`;
}
function tlTip(e,code){
  const j=JOB[code];
  showTip(`<div class="t-h"><span>${j.code}</span><span>${j.type}</span></div>
    <div class="t-r"><span class="l">งาน</span><span class="v">${esc(j.name)}</span></div>
    <div class="t-r"><span class="l">ลูกค้า</span><span class="v">${esc(j.cust)}</span></div>
    <div class="t-r"><span class="l">เริ่มงาน</span><span class="v">${dth(j.start)}</span></div>
    <div class="t-r"><span class="l">ส่งมอบ</span><span class="v">${dth(j.due)}</span></div>
    <div class="t-r"><span class="l">ใช้เวลา</span><span class="v">${hours(j.leadDays)} วัน</span></div>
    <div class="t-r"><span class="l">ต้นทุนค่าแรงรวม</span><span class="v">${money(j.total)}</span></div>
    <div class="t-f">${j.done?'✓ ส่งมอบแล้ว':'● อยู่ระหว่างผลิต'} · % ต้นทุนต่องบ ${pct(j.pctBudget)}</div>`,e.clientX,e.clientY-12);
}
</script>
