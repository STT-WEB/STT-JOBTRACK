<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STT NOVA-HR Hub · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--brand:#E2231A;--brand2:#1A1A1A;--brand-bg:#FCEBEB;
    --ink:#1A1A1A;--muted:#6B6B6B;--hint:#9A9A9A;--line:#E6E6E6;--bg:#F4F4F2;--card:#fff;
    --ok:#1B7A3D;--warn:#BA7517;--warnbg:#FFF8E1;--danger:#CC0000;--blue:#185FA5;--teal:#0F6E56}
  body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:14px}
  .app{max-width:1080px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.07);min-height:600px}
  .accent{height:5px;background:var(--brand)}
  /* top bar */
  .top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .top img{height:34px;width:auto}
  .top .sp{margin-left:auto}
  .pill{font-size:12px;color:var(--brand);background:var(--brand-bg);padding:4px 11px;border-radius:8px;font-weight:600;cursor:pointer;border:none}
  .ico{color:var(--muted);font-size:15px;cursor:pointer;background:none;border:none}
  .body{padding:18px}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .center{text-align:center}
  .muted{color:var(--muted)} .hint{color:var(--hint)}
  /* login */
  .langs{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:16px 0}
  .lang{border:1px solid var(--line);border-radius:18px;padding:5px 14px;font-size:13px;color:var(--muted);cursor:pointer}
  .lang.on{border-color:var(--brand);color:var(--brand);font-weight:600}
  .pin{display:flex;gap:8px;justify-content:center;margin:12px 0 18px}
  .pin span{width:34px;height:42px;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px}
  /* company */
  .companies{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:480px;margin:18px auto}
  .ccard{border:2px solid var(--line);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;transition:.12s}
  .ccard:hover{transform:translateY(-2px)}
  .ccard .ci{font-size:32px}
  /* home */
  .gtitle{font-size:12.5px;color:var(--muted);font-weight:600;margin:16px 0 8px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .tile{border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:.12s;background:var(--card)}
  .tile:hover{border-color:var(--brand);transform:translateY(-1px)}
  .tile.lock{opacity:.4;cursor:not-allowed}
  .tile .ic{font-size:23px;color:var(--brand)} .tile .nm{font-weight:600;font-size:13.5px;margin-top:5px}
  .tile .sb{font-size:11px;color:var(--muted)} .tile .bd{font-size:11px;margin-top:5px}
  .roles{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:4px 0 6px}
  .chip{border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:12px;color:var(--muted);cursor:pointer}
  .chip.on{border-color:var(--brand);background:var(--brand-bg);color:var(--brand);font-weight:600}
  .back{font-size:12.5px;color:var(--brand);cursor:pointer;margin-bottom:12px;display:inline-block;background:none;border:none;font-family:inherit}
  /* login split */
  .lg{display:flex;flex-wrap:wrap;min-height:540px}
  .lg-l{flex:1;min-width:250px;padding:38px 32px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#fafafa,var(--brand-bg))}
  .lg-r{flex:1;min-width:250px;padding:38px 32px;background:#fff;display:flex;flex-direction:column;justify-content:center}
  .lg-tab{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-family:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
  .lg-tab.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
  .fld{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;margin-bottom:13px;background:#fff;color:var(--ink)}
  .fld:focus{outline:none;border-color:var(--brand)}
  .lbl{display:block;font-size:12px;font-weight:600;margin:2px 0 5px}
  .btn-line{background:#06C755;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
  /* dashboard */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--bg);border-radius:10px;padding:11px 13px}
  .kpi .l{font-size:11px;color:var(--muted)} .kpi .v{font-size:21px;font-weight:600;margin-top:3px} .kpi .s{font-size:10.5px;color:var(--hint)}
  .kpi.warn{background:var(--warnbg)} .kpi.warn .l,.kpi.warn .v,.kpi.warn .s{color:var(--warn)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .ptitle{font-size:12.5px;font-weight:600;margin-bottom:12px}
  .chart{display:flex;align-items:flex-end;gap:9px;height:150px}
  .chart .col{flex:1;text-align:center}
  .chart .bar{background:var(--brand);border-radius:5px 5px 0 0}
  .chart .val{font-size:9.5px;color:var(--muted);margin-bottom:3px} .chart .mo{font-size:10px;color:var(--muted);margin-top:4px}
  .jfilter{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .jobcard{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
  .jobcard:hover{border-color:var(--brand)}
  .jc-h{display:flex;justify-content:space-between;align-items:baseline}
  .jc-code{font-weight:600;font-size:13.5px} .jc-cost{font-weight:600;font-size:14px}
  .jc-name{font-size:11.5px;color:var(--muted);margin:2px 0 7px}
  .otbar{display:flex;height:7px;border-radius:4px;overflow:hidden}
  .otbar .n{background:var(--ok)} .otbar .o{background:var(--warn)}
  .otleg{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:4px}
  .crumb{text-align:center;font-size:11px;color:var(--hint);margin-top:12px}
  @media(max-width:560px){
    body{padding:6px} .app{border-radius:12px} .body{padding:13px}
    .companies{grid-template-columns:1fr} .top{padding:11px 13px}
    .chart{height:120px}
  }
</style>
</head>

<div class="app">
  <div class="accent" id="acc"></div>
  <div id="scr"></div>
</div>
<div class="crumb" id="cr"></div>

function theme(){var t=THEME[S.company],r=document.documentElement.style;
  r.setProperty('--brand',t.brand);r.setProperty('--brand2',t.brand2);r.setProperty('--brand-bg',t.bg);
  document.getElementById('acc').style.background=t.brand;}
function go(s){S.screen=s;render();}
function setc(c){S.company=c;go('home');}

function topbar(){return '<div class="top"><img src="'+LOGO[S.company]+'" alt="'+S.company+'">'
  +'<button class="ico" title="สลับบริษัท" onclick="go(\'company\')"><i class="ti ti-switch-horizontal"></i></button>'
  +'<button class="ico"><i class="ti ti-world"></i></button>'
  +'<span class="sp"></span>'
  +'<button class="pill" onclick="go(\'company\')">'+S.company+' · '+roleName[S.role]+'</button></div>';}

function tile(ic,nm,sb,st,onclick){
  var badge=st==='ok'?'<span class="bd" style="color:var(--ok)">● ใช้งาน</span>'
    :st==='build'?'<span class="bd" style="color:var(--warn)">● กำลังทำ</span>'
    :st==='lock'?'<span class="bd hint"><i class="ti ti-lock"></i> ไม่มีสิทธิ์</span>':'<span class="bd hint">วางแผน</span>';
  var lock=st==='lock',oc=(onclick&&!lock)?' onclick="'+onclick+'"':'';
  return '<div class="tile'+(lock?' lock':'')+'"'+oc+'><div class="ic"><i class="ti '+ic+'"></i></div>'
    +'<div class="nm">'+nm+'</div><div class="sb">'+sb+'</div>'+badge+'</div>';}

  return '<div class="lg">'+left+right+'</div>';},

company:function(){return topbar()+'<div class="body"><div class="center" style="font-weight:600;font-size:16px;margin-top:8px">เลือกบริษัท</div>'
  +'<div class="center muted" style="font-size:12px">ข้อมูลแยกกัน · บางเมนูใช้ร่วม (ประกาศ/ปฏิทิน/ประวัติ)</div>'
  +'<div class="companies">'
  +'<div class="ccard" style="border-color:#E2231A" onclick="setc(\'STT\')"><div class="ci" style="color:#E2231A"><i class="ti ti-tank"></i></div><div style="font-weight:700;margin-top:8px">STT</div><div class="muted" style="font-size:11.5px">Sutee Tankers · ผลิตแท็งค์</div></div>'
  +'<div class="ccard" style="border-color:#2E3192" onclick="setc(\'S1\')"><div class="ci" style="color:#2E3192"><i class="ti ti-truck"></i></div><div style="font-weight:700;margin-top:8px">S1</div><div class="muted" style="font-size:11.5px">S1 Logistics · ขนส่ง</div></div>'
  +'</div></div>';},

home:function(){
  var chips='<div class="roles"><span class="muted" style="font-size:11.5px">ดูมุมมองสิทธิ์:</span>'
    +Object.keys(roleName).map(function(r){return '<span class="chip'+(S.role==r?' on':'')+'" onclick="setr(\''+r+'\')">'+roleName[r]+'</span>';}).join('')+'</div>';
  var content=S.role=='emp'?homeEmp():homeAdmin();
  return topbar()+'<div class="body">'+chips+content+'</div>';},

jobcost:function(){return topbar()+'<div class="body">'+dashboard()+'</div>';}
};

    +tile('ti-clock',jt,'บันทึกเวลา/OT','ok',"go('jobcost')")
    +tile('ti-cash','Payroll & Job Cost','ต้นทุน+เงินเดือน',canCost?'build':'lock',canCost?"go('jobcost')":'')
    +tile('ti-id','ทะเบียนประวัติ','ข้อมูล+เอกสาร','plan','')
    +tile('ti-user-plus','สรรหา&รับเข้า','Onboarding','plan','')
    +tile('ti-chart-dots','วิเคราะห์คน','เข้างาน/ลาออก',(S.role=='exec'||S.role=='hr')?'plan':'lock','')
    +tile('ti-calendar-stats','การลา+ประเมินผล','Performance','plan','')+'</div>'
    +'<div class="gtitle">HRD · พัฒนาบุคคล</div><div class="tiles">'
    +tile('ti-school','อบรมพนักงาน','แผน/ประวัติ','plan','')
    +tile('ti-table','Skill Matrix','ทักษะรายคน','plan','')
    +tile('ti-route','Career Path','IDP','plan','')+'</div>'
    +'<div class="gtitle">พัสดุ HR + สื่อสารองค์กร</div><div class="tiles">'
    +tile('ti-shirt','เครื่องแบบ/PPE','เบิก-คืน','plan','')
    +tile('ti-speakerphone','ประกาศ','ข่าว+แปลภาษา','plan','')
    +tile('ti-calendar','ปฏิทินกิจกรรม','ทั้งบริษัท','plan','')+'</div>';}

function homeEmp(){return '<div class="muted" style="font-size:11.5px">พนักงานเห็นเฉพาะเมนูของตัวเอง</div><div class="tiles" style="margin-top:8px">'

];
var jfilter='all';
function setf(t){jfilter=t;render();}

function dashboard(){
  var months=[{m:'ม.ค.',v:656,h:100},{m:'ก.พ.',v:887,h:135},{m:'มี.ค.',v:978,h:149},{m:'เม.ย.',v:986,h:150},{m:'พ.ค.',v:0,h:0},{m:'มิ.ย.',v:0,h:0},{m:'ก.ค.',v:0,h:0},{m:'ส.ค.',v:0,h:0}];
  var bars=months.map(function(x){return '<div class="col"><div class="val">'+(x.v?x.v+'K':'—')+'</div>'
    +'<div class="bar" style="height:'+(x.h||6)+'px;'+(x.h?'':'background:var(--line)')+'"></div><div class="mo">'+x.m+'</div></div>';}).join('');
  var cards=JOBS.filter(function(j){return jfilter=='all'||j.t==jfilter;}).map(function(j){
    var n=100-j.ot;var flag=j.ot>=20?' <span style="color:var(--warn)">⚠ บวม</span>':'';
    return '<div class="jobcard"><div class="jc-h"><span class="jc-code">'+j.code+'</span><span class="jc-cost">฿'+j.cost.toLocaleString()+'</span></div>'
      +'<div class="jc-name">'+j.name+'</div>'
      +'<div class="otbar"><div class="n" style="width:'+n+'%"></div><div class="o" style="width:'+j.ot+'%"></div></div>'
      +'<div class="otleg"><span>ปกติ '+n+'%</span><span style="color:var(--warn)">OT '+j.ot+'%'+flag+'</span></div></div>';
  }).join('');
  return '<button class="back" onclick="go(\'home\')"><i class="ti ti-arrow-left"></i> กลับ Home</button>'
  +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px"><span style="font-weight:600;font-size:15px">Job Cost — ต้นทุนค่าแรง</span>'
  +'<span style="font-size:10.5px;color:var(--danger);background:var(--brand-bg);padding:2px 8px;border-radius:6px"><i class="ti ti-lock"></i> HR/ผู้บริหาร</span>'
  +'<span class="sp" style="margin-left:auto"></span><span class="chip on">Direct</span><span class="chip">+ Indirect (เร็วๆนี้)</span></div>'
  +'<div class="kpis">'
  +'<div class="kpi"><div class="l">ต้นทุน Direct (ม.ค.–เม.ย.)</div><div class="v">฿3.51M</div><div class="s">3,507,404 บาท</div></div>'
  +'<div class="kpi"><div class="l">จ๊อบมีต้นทุน (ม.ค.)</div><div class="v">117</div><div class="s">จ๊อบลูกค้า</div></div>'
  +'<div class="kpi"><div class="l">%OT เฉลี่ย</div><div class="v" style="color:var(--warn)">8.4%</div><div class="s">ของค่าแรง</div></div>'
  +'<div class="kpi warn"><div class="l">รอใส่งบ</div><div class="v">117</div><div class="s">กรอก Budget</div></div></div>'
  +'<div class="panel"><div class="ptitle">ต้นทุนค่าแรง Direct รายเดือน (บาท)</div><div class="chart">'+bars+'</div>'
  +'<div class="hint" style="font-size:10.5px;margin-top:8px">ม.ค.–เม.ย. = ข้อมูลจริง (นำเข้า) · ส.ค.→ จาก JOBTRACK อัตโนมัติ</div></div>'
  +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px"><span style="font-weight:600;font-size:13px">ต้นทุนต่อจ๊อบ · มกราคม 2026</span></div>'
  +'<div class="jfilter">'+['all','JT','JM','JMS','JP'].map(function(t){return '<span class="chip'+(jfilter==t?' on':'')+'" onclick="setf(\''+t+'\')">'+(t=='all'?'ทั้งหมด':t)+'</span>';}).join('')+'</div>'
  +cards
  +'<div class="hint" style="font-size:11px;margin-top:6px">แถบ <b style="color:var(--ok)">เขียว=ปกติ</b> / <b style="color:var(--warn)">เหลือง=OT</b> → เห็นจ๊อบที่ OT บวม (เช่น JT-68/0058 OT 22%) · คลิกจ๊อบเจาะ Process/รายคนได้</div>';}

var CRUMB={login:'หน้าเข้าสู่ระบบ',company:'เลือกบริษัท',home:'หน้า Home',jobcost:'Job Cost Dashboard',ess:'หน้าพนักงาน'};
function render(){theme();
  document.getElementById('acc').style.background=(S.screen==='login')?'linear-gradient(90deg,#E2231A,#7a1f8f,#2E3192)':THEME[S.company].brand;
  document.getElementById('scr').innerHTML=SCREENS[S.screen]();
  document.getElementById('cr').textContent='NOVA-HR Hub Prototype · '+CRUMB[S.screen]+' · '+S.company+' · ย่อจอ = ดูแบบมือถือ';}
render();
