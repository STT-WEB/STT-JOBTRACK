<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOBTRACK · กำลังเข้าสู่ระบบ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0c11;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;padding:20px;}
.card{background:#0f1117;border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:32px;text-align:center;max-width:320px;width:100%;}
.icon{font-size:48px;margin-bottom:16px;}
.title{font-size:20px;font-weight:700;color:#f0f2f5;margin-bottom:8px;}
.sub{font-size:13px;color:#8b92a5;line-height:1.6;}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,0.1);border-top-color:#00e187;border-radius:50%;animation:spin 0.8s linear infinite;margin:16px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">⏳</div>
  <div class="title" id="title">กำลังเข้าสู่ระบบ...</div>
  <div class="spinner" id="spinner"></div>
  <div class="sub" id="sub">กรุณารอสักครู่</div>
</div>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTkeQyQm9yFMcZMS-2MaMaO_3C_mnjWOtjZ2Ql5vFI1ZMKsKEDcbOYSDjic1dG0fDYJw/exec';
const REGISTER_URL    = 'https://stt-web.github.io/STT-JOBTRACK/register.html';

async function handleCallback(){
  var params = new URLSearchParams(window.location.search);
  var code   = params.get('code');
  var error  = params.get('error');

  if(error || !code){
    showError('ยกเลิกการ Login');
    return;
  }

  // Warmup Apps Script ก่อนส่ง Code
  document.getElementById('sub').textContent = 'กำลังเชื่อมต่อเซิร์ฟเวอร์...';
  await warmup();
  document.getElementById('sub').textContent = 'กำลังยืนยันตัวตน...';

  try{
    var result = await apiPost({
      action:   'LINE_CALLBACK',
      code:     code,
      redirect: 'https://stt-web.github.io/STT-JOBTRACK/callback_register.html'
    });

    if(result.ok && result.profile){
      // เก็บ Profile ใน sessionStorage + localStorage
      var userData = JSON.stringify({
        lineId:      result.profile.userId,
        displayName: result.profile.displayName,
        pictureUrl:  result.profile.pictureUrl,
      });
      try { sessionStorage.setItem('reg_user', userData); } catch(e){}
      try { localStorage.setItem('reg_user', userData); } catch(e){}

      document.getElementById('icon').textContent  = '✅';
      document.getElementById('title').textContent = 'Login สำเร็จ!';
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('sub').textContent   = 'ยินดีต้อนรับ ' + result.profile.displayName;
      setTimeout(function(){ window.location.href = REGISTER_URL; }, 1200);

    } else {
      showError(result.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่');
    }
  } catch(e){
    var msg = String(e.message || e);
    if(msg.indexOf('invalid_grant') >= 0 || msg.indexOf('400') >= 0){
      // Code หมดอายุ → กลับหน้า Register ให้ Login ใหม่
      document.getElementById('icon').textContent  = '🔄';
      document.getElementById('title').textContent = 'กำลังเชื่อมต่อใหม่...';
      document.getElementById('sub').textContent   = 'กรุณารอสักครู่';
      setTimeout(function(){ window.location.href = REGISTER_URL; }, 1500);
    } else {
      showError('ไม่สามารถเชื่อมต่อได้ กรุณาลองใหม่');
    }
  }
}

// Warmup Apps Script เพื่อลด Cold Start
function warmup(){
  return new Promise(function(resolve){
    var cbName = 'cb_warmup_' + Date.now();
    var url = APPS_SCRIPT_URL + '?data=' + encodeURIComponent('{"action":"PING"}') + '&callback=' + cbName;
    window[cbName] = function(){ delete window[cbName]; resolve(); };
    var s = document.createElement('script');
    s.src = url;
    s.onerror = function(){ delete window[cbName]; resolve(); };
    document.head.appendChild(s);
    setTimeout(function(){ if(window[cbName]){ delete window[cbName]; resolve(); } }, 3000);
  });
}

function showError(msg){
  document.getElementById('icon').textContent  = '❌';
  document.getElementById('title').textContent = 'เกิดข้อผิดพลาด';
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('sub').innerHTML = msg + '<br><br><a href="'+REGISTER_URL+'" style="color:#4d9cff">← ลองใหม่</a>';
}

function apiPost(payload){
  return new Promise(function(resolve, reject){
    var cbName = 'cb_' + Date.now();
    var params = encodeURIComponent(JSON.stringify(payload));
    var url    = APPS_SCRIPT_URL + '?data=' + params + '&callback=' + cbName;
    window[cbName] = function(r){
      delete window[cbName];
      try { document.head.removeChild(s); } catch(e){}
      resolve(r);
    };
    var s = document.createElement('script');
    s.src = url;
    s.onerror = function(){ delete window[cbName]; reject(new Error('Network')); };
    document.head.appendChild(s);
    setTimeout(function(){
      if(window[cbName]){ delete window[cbName]; reject(new Error('Timeout')); }
    }, 20000);
  });
}

handleCallback();
</script>
</body>
</html>
