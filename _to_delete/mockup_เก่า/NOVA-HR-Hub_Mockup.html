<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STT NOVA-HR Hub · Mockup ระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --brand:#E2231A; --brand2:#1A1A1A; --brand-bg:#FCEBEB;
    --ink:#1A1A1A; --muted:#6B6B6B; --hint:#9A9A9A; --line:#E5E5E5;
    --bg:#F4F4F2; --card:#FFFFFF; --ok:#1B7A3D; --warn:#9A6A00; --danger:#CC0000;
  }
  body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);padding:20px;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto}
  .titlebar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .titlebar h1{font-size:18px;font-weight:700}
  .titlebar .sub{font-size:12px;color:var(--muted)}
  .device{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.06);min-height:520px;position:relative}
  .accent{height:6px;background:var(--brand)}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .topbar img{height:36px;width:auto}
  .topbar .pill{margin-left:auto;font-size:11px;color:var(--brand);background:var(--brand-bg);padding:3px 10px;border-radius:7px;font-weight:600;cursor:pointer}
  .topbar .ico{color:var(--muted);font-size:13px;cursor:pointer}
  .body{padding:16px}
  .btn{background:var(--brand);color:#fff;text-align:center;border-radius:9px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;border:none;width:100%}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .grid{display:grid;gap:9px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .tile{border:1px solid var(--line);border-radius:11px;padding:12px 13px;cursor:pointer;transition:.12s}
  .tile:hover{border-color:var(--brand);transform:translateY(-1px)}
  .tile.lock{opacity:.42;cursor:not-allowed}
  .tile .ic{font-size:22px;color:var(--brand)}
  .tile .nm{font-weight:600;font-size:13px;margin-top:5px}
  .tile .sb{font-size:11px;color:var(--muted)}
  .tile .bd{font-size:11px;margin-top:5px}
  .gtitle{font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 7px}
  .roles{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 4px}
  .chip{border:1px solid var(--line);border-radius:15px;padding:3px 11px;font-size:12px;color:var(--muted);cursor:pointer}
  .chip.on{border-color:var(--brand);background:var(--brand-bg);color:var(--brand);font-weight:600}
  .back{font-size:12px;color:var(--brand);cursor:pointer;margin-bottom:10px;display:inline-block}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}
  .metric{background:var(--bg);border-radius:9px;padding:10px 12px}
  .metric .l{font-size:11px;color:var(--muted)}
  .metric .v{font-size:18px;font-weight:700;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{background:var(--bg);color:var(--muted);text-align:left;padding:8px 10px;font-weight:600;font-size:11.5px}
  td{padding:8px 10px;border-top:1px solid var(--line)}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--muted)}
  .tab.on{border-color:var(--brand);background:var(--brand-bg);color:var(--brand);font-weight:600}
  .langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .lang{border:1px solid var(--line);border-radius:18px;padding:4px 13px;font-size:13px;color:var(--muted);cursor:pointer}
  .lang.on{border-color:var(--brand);color:var(--brand);font-weight:600}
  .pin{display:flex;gap:7px;justify-content:center;margin:10px 0 16px}
  .pin span{width:34px;height:40px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .center{text-align:center}
  .logo-big{font-size:34px;color:var(--brand)}
  .crumb{display:flex;justify-content:space-between;font-size:11px;color:var(--hint);margin-top:10px}
  .note{font-size:11px;color:var(--hint);margin-top:8px}
  .companies{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;margin:16px auto}
  .ccard{border:1px solid var(--line);border-radius:13px;padding:22px;text-align:center;cursor:pointer}
  .ccard.stt{border:2px solid #E2231A}.ccard.s1{border:2px solid #2E3192}
  .ccard .ci{font-size:28px}
  @media print{body{background:#fff}.device{box-shadow:none;page-break-inside:avoid}}
</style>
</head>

  S1:{brand:'#2E3192',brand2:'#F26522',bg:'#E6E8F5',name:'S1 Logistics',work:'ขนส่ง',ci:'ti-truck'}
};
var S={screen:'login',company:'STT',role:'exec',jt:'master'};
var roleName={exec:'ผู้บริหาร',hr:'HR/Payroll',recruit:'สรรหา',emp:'พนักงาน'};

function applyTheme(){var t=THEME[S.company];var r=document.documentElement.style;
  r.setProperty('--brand',t.brand);r.setProperty('--brand2',t.brand2);r.setProperty('--brand-bg',t.bg);
  document.getElementById('acc').style.background=t.brand;}

function go(s){S.screen=s;render();}
function setc(c){S.company=c;go('home');}
function setr(r){S.role=r;render();}
function setjt(t){S.jt=t;render();}

function topbar(){var t=THEME[S.company];
  return '<div class="topbar"><img src="'+LOGO[S.company]+'" alt="'+S.company+'">'
    +'<span class="ico" onclick="go(\'company\')" title="สลับบริษัท"><i class="ti ti-switch-horizontal"></i></span>'
    +'<span class="ico"><i class="ti ti-world"></i> ไทย</span>'
    +'<span class="pill" onclick="go(\'company\')">'+S.company+' · '+roleName[S.role]+'</span></div>';}

function tile(ic,nm,sb,st,onclick){
  var badge=st==='ok'?'<span class="bd" style="color:var(--ok)">● ใช้งาน</span>'
    :st==='build'?'<span class="bd" style="color:var(--warn)">● กำลังทำ</span>'
    :st==='lock'?'<span class="bd" style="color:var(--hint)"><i class="ti ti-lock"></i> ไม่มีสิทธิ์</span>'
    :'<span class="bd" style="color:var(--hint)">วางแผน</span>';
  var lock=st==='lock';
  var oc=(onclick&&!lock)?' onclick="'+onclick+'"':'';
  return '<div class="tile'+(lock?' lock':'')+'"'+oc+'><div class="ic"><i class="ti '+ic+'"></i></div>'
    +'<div class="nm">'+nm+'</div><div class="sb">'+sb+'</div>'+badge+'</div>';}

function screenLogin(){var t=THEME[S.company];
  return '<div class="body center" style="padding:34px 20px">'
    +'<div class="logo-big"><i class="ti ti-layout-grid"></i></div>'
    +'<div style="font-weight:700;font-size:18px;margin:6px 0 2px">STT NOVA-HR Hub</div>'
    +'<div style="font-size:12px;color:var(--muted)">ศูนย์กลางงานบุคคล · Sutee Tankers + S1 Logistics</div>'
    +'<div class="langs">'+['ไทย','မြန်မာ','ລາວ','ខ្មែរ','EN'].map(function(l,i){return '<span class="lang'+(i==0?' on':'')+'">'+l+'</span>';}).join('')+'</div>'

    +'<button class="btn" onclick="go(\'company\')">เข้าสู่ระบบ</button>'
    +'<div style="font-size:11px;color:var(--hint);margin:10px 0">— หรือ —</div>'
    +'<button class="btn ghost" onclick="go(\'company\')"><i class="ti ti-brand-line"></i> เข้าด้วย LINE / Google</button></div></div>';}

  return topbar()+'<div class="body"><div class="center" style="font-weight:600;font-size:15px;margin-top:6px">เลือกบริษัทที่จะเข้าใช้งาน</div>'
    +'<div class="center note">ข้อมูลแยกคนละชุด · บางเมนู (ประกาศ/ปฏิทิน/ประวัติ) ใช้ร่วมกัน</div>'

function screenHome(){var t=THEME[S.company];
  var roleChips='<div class="roles"><span style="font-size:11px;color:var(--muted)">ดูมุมมองสิทธิ์:</span>'

  var content=S.role=='emp'?homeEmp():homeAdmin();
