<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOBTRACK · LINE Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0c11;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'IBM Plex Sans Thai',sans-serif;padding:20px;}
.card{background:#0f1117;border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:32px;text-align:center;max-width:320px;width:100%;}
.icon{font-size:48px;margin-bottom:16px;}
.title{font-size:20px;font-weight:700;color:#f0f2f5;margin-bottom:8px;}
.sub{font-size:13px;color:#8b92a5;line-height:1.6;}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,0.1);border-top-color:#00e187;border-radius:50%;animation:spin 0.8s linear infinite;margin:16px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#ff5c5c;font-size:13px;margin-top:12px;}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">⏳</div>
  <div class="title" id="title">กำลังเข้าสู่ระบบ...</div>
  <div class="spinner" id="spinner"></div>
  <div class="sub" id="sub">กรุณารอสักครู่</div>
</div>

<script>
const LINE_CHANNEL_ID = '2009924671';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQwngtAWD4WNu4zOO6r066OkT3Oz4oLowXbSRmTmveOHs30gcgq7Sr_mMYwLCdRXthiw/exec';

async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const state  = params.get('state');
  const error  = params.get('error');

  if (error) {
    showError('ยกเลิกการ Login');
    return;
  }

  if (!code) {
    showError('ไม่พบ Authorization Code');
    return;
  }

  try {
    // ส่ง code ไปให้ Apps Script แลก Token + ดึงข้อมูล Profile
    const result = await apiPost({
      action:   'LINE_CALLBACK',
      code:     code,
      state:    state,
      redirect: 'https://stt-web.github.io/STT-JOBTRACK/callback.html'
    });

    if (result.ok && result.profile) {
      // บันทึก Profile ลง localStorage
      localStorage.setItem('jobtrack_user', JSON.stringify({
        lineId:      result.profile.userId,
        displayName: result.profile.displayName,
        pictureUrl:  result.profile.pictureUrl,
        empId:       result.empId   || '',
        empName:     result.empName || result.profile.displayName,
        empDept:     result.empDept || '',
        empRole:     result.empRole || '',
      }));

      // กลับไปหน้าที่มาจาก หรือ หน้าหลัก
      const returnUrl = sessionStorage.getItem('jobtrack_return') || 
                        'https://stt-web.github.io/STT-JOBTRACK/job_checkin_app.html';
      sessionStorage.removeItem('jobtrack_return');

      document.getElementById('icon').textContent  = '✅';
      document.getElementById('title').textContent = 'เข้าสู่ระบบสำเร็จ!';
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('sub').textContent   = 'ยินดีต้อนรับ ' + result.profile.displayName;

      setTimeout(() => { window.location.href = returnUrl; }, 1500);
    } else {
      showError(result.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่');
    }
  } catch(e) {
    showError('ไม่สามารถเชื่อมต่อได้ กรุณาลองใหม่');
  }
}

function showError(msg) {
  document.getElementById('icon').textContent  = '❌';
  document.getElementById('title').textContent = 'เกิดข้อผิดพลาด';
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('sub').innerHTML = msg + '<br><br><a href="javascript:history.back()" style="color:#4d9cff">← ลองใหม่</a>';
}

function apiPost(payload) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now();
    const params = encodeURIComponent(JSON.stringify(payload));
    const url    = APPS_SCRIPT_URL + '?data=' + params + '&callback=' + cbName;
    window[cbName] = (r) => { delete window[cbName]; document.head.removeChild(s); resolve(r); };
    const s = document.createElement('script');
    s.src = url;
    s.onerror = () => { delete window[cbName]; reject(new Error('Network error')); };
    document.head.appendChild(s);
    setTimeout(() => { if(window[cbName]) { delete window[cbName]; reject(new Error('Timeout')); } }, 15000);
  });
}

handleCallback();
</script>
</body>
</html>
